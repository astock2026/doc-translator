<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — DocTranslator</title>
    <style>
        :root {
            --blue-600: #2563eb;
            --blue-700: #1d4ed8;
            --blue-50: #eff6ff;
            --blue-100: #dbeafe;
            --text: #111827;
            --text-secondary: #6b7280;
            --text-tertiary: #9ca3af;
            --border: #e5e7eb;
            --bg: #ffffff;
            --bg-secondary: #f9fafb;
            --radius: 12px;
            --radius-sm: 8px;
            --danger: #dc2626;
            --danger-bg: #fee2e2;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 640px;
            margin: 0 auto;
            padding: 60px 20px 40px;
        }

        /* Nav */
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 48px;
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: var(--text);
            font-size: 16px;
            font-weight: 600;
        }
        .nav-brand-icon {
            width: 32px;
            height: 32px;
            border-radius: 10px;
            background: var(--blue-600);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .nav-brand-icon svg { width: 16px; height: 16px; }
        .nav-links { display: flex; align-items: center; gap: 16px; font-size: 13px; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; }
        .nav-links a:hover { color: var(--text); }
        .btn-signin {
            border: 0.5px solid #d1d5db;
            border-radius: 20px;
            padding: 5px 14px;
            font-size: 12px;
            color: var(--text);
            text-decoration: none;
        }
        .btn-signin:hover { background: var(--bg-secondary); }

        /* Card */
        .card {
            background: var(--bg);
            border: 0.5px solid var(--border);
            border-radius: 16px;
            padding: 32px;
        }

        .card-header {
            text-align: center;
            margin-bottom: 28px;
        }
        .card-header h1 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.01em;
            margin-bottom: 6px;
        }
        .card-header p {
            font-size: 14px;
            color: var(--text-secondary);
        }

        /* Form */
        .form-group {
            margin-bottom: 18px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--text);
            margin-bottom: 6px;
        }
        .form-group input {
            width: 100%;
            padding: 11px 14px;
            font-size: 14px;
            font-family: inherit;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            background: var(--bg);
            outline: none;
            transition: border-color 0.15s;
        }
        .form-group input:focus {
            border-color: var(--blue-600);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-group input::placeholder {
            color: var(--text-tertiary);
        }

        .form-options {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 22px;
            font-size: 13px;
        }
        .form-options label {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            cursor: pointer;
        }
        .form-options input[type="checkbox"] {
            width: 15px;
            height: 15px;
            accent-color: var(--blue-600);
        }
        .form-options a {
            color: var(--blue-600);
            text-decoration: none;
        }
        .form-options a:hover { text-decoration: underline; }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 13px 28px;
            border-radius: var(--radius-sm);
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            font-family: inherit;
            transition: background 0.15s;
        }
        .btn-primary {
            background: var(--blue-600);
            color: white;
            width: 100%;
        }
        .btn-primary:hover { background: var(--blue-700); }

        .card-footer {
            text-align: center;
            margin-top: 22px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .card-footer a {
            color: var(--blue-600);
            text-decoration: none;
            font-weight: 500;
        }
        .card-footer a:hover { text-decoration: underline; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
        }
        .back-link:hover { color: var(--text); }

        /* Footer */
        .footer {
            border-top: 0.5px solid var(--border);
            padding-top: 16px;
            margin-top: 40px;
            display: flex;
            gap: 16px;
            font-size: 12px;
            justify-content: center;
        }
        .footer a { color: var(--text-secondary); text-decoration: none; }
        .footer a:hover { color: var(--text); }

        @media (max-width: 500px) {
            .container { padding: 30px 14px 24px; }
            .card { padding: 24px 20px; }
            .card-header h1 { font-size: 20px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Nav -->
    <nav class="nav">
        <a href="/" class="nav-brand">
            <div class="nav-brand-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
            </div>
            <span>DocTranslator</span>
        </a>
        <div class="nav-links">
            <a href="/payment">Payment</a>
            <a href="/login" class="btn-signin">Sign in</a>
        </div>
    </nav>

    <!-- Sign In Card -->
    <div class="card">
        <div class="card-header">
            <h1>Welcome back</h1>
            <p>Sign in to your DocTranslator account</p>
        </div>

        <form method="post" action="/api/login">
            <div class="form-group">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" placeholder="you@example.com" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>

            <div class="form-options">
                <label>
                    <input type="checkbox" name="remember">
                    Remember me
                </label>
                <a href="#forgot">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn-primary">Sign in</button>
        </form>

        <div class="card-footer">
            Don't have an account? <a href="#signup">Sign up</a>
        </div>
    </div>

    <a href="/" class="back-link">&larr; Back to DocTranslator</a>

    <!-- Footer -->
    <footer class="footer">
        <a href="/privacy">Privacy</a>
        <a href="/contact">Contact</a>
    </footer>
</div>
</body>
</html>
